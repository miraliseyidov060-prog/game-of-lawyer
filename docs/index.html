<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KALKHAN</title>
  <meta name="description" content="KALKHAN: Azərbaycan hüququ üzrə sual oyunu">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" id="tc" content="#F6F1E8">
  <script>
    /* Mövzu ilk çəkilişdən əvvəl tətbiq olunur (ağ/qara işıq çaxmasın) */
    (function () {
      try {
        var t = localStorage.getItem('kalkhan.theme'), r = document.documentElement;
        if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.getElementById('tc').setAttribute('content', dark ? '#0E0E0E' : '#F6F1E8');
        var m = localStorage.getItem('kalkhan.motion');
        if (m === 'reduce') r.classList.add('reduce-motion'); else if (m === 'full') r.classList.add('full-motion');
      } catch (e) { /* məxfi rejim */ }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KALKHAN">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/barlow-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <noscript><p style="padding:24px">Bu oyun JavaScript tələb edir.</p></noscript>
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
